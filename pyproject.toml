[tool.poetry]
name = "ceynic-api"
version = "0.1.0"
description = "Backend infrastructure for ceynic.com"
authors = ["Jeffrey Nicholas <jefnic23@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.7"
uvicorn = "^0.29.0"
fastapi-mail = "^1.4.1"
sqlmodel = "^0.0.18"
python-dotenv = "^1.0.1"
pydantic-settings = "^2.2.1"
psycopg2 = "^2.9.9"
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
email-validator = "^2.1.1"
python-multipart = "^0.0.9"
aiohttp = {extras = ["speedups"], version = "^3.9.5"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
stripe = "^12.0.1"
cloudinary = "^1.44.0"
python-slugify = "^8.0.4"
pillow = "^11.3.0"
ruff = "^0.12.7"
pre-commit = "^4.2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
